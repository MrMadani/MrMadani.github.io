<!doctype html>
<!-- Source for assets/og-image.png (the LinkedIn/social preview). Regenerate with tools/make-images.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:'DM Sans',Helvetica,Arial,sans-serif;color:#fff;box-sizing:border-box;position:relative;
    background-color:#0f1b2d;
    background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:48px 48px;display:flex;flex-direction:column;justify-content:center;padding:0 0 0 84px}
  body::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 50%,transparent 30%,#0f1b2d 85%)}
  .photo{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:480px;height:480px;z-index:1;
    -webkit-mask-image:radial-gradient(circle closest-side,#000 88%,transparent 100%)}
  .txt{max-width:640px;position:relative;z-index:1}
  .mark{width:60px;height:60px;border-radius:12px;background:#fff;color:#0f1b2d;font-family:'Fraunces',serif;font-weight:500;
    font-size:36px;display:flex;align-items:center;justify-content:center;margin-bottom:40px}
  .eyebrow{font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#e3a684;margin-bottom:20px}
  h1{font-family:'Fraunces',serif;font-size:76px;line-height:1.02;margin:0 0 28px;font-weight:500;letter-spacing:-1.5px}
  h1 em{font-weight:400;color:#e9b392}
  p{font-size:23px;color:#b9c3d3;margin:0;line-height:1.5}
</style></head>
<body>
  <img class="photo" src="../assets/profile.jpg">
  <div class="txt">
    <div class="mark">S</div>
    <div class="eyebrow">Cybersecurity · Sales · AI Automation</div>
    <h1>Shahin<br><em>AI that does the busywork.</em></h1>
    <p>M.S. Computer Science (GWU) · CompTIA Security+<br>mrmadani.github.io</p>
  </div>
</body></html>
