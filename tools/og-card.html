<!doctype html>
<!-- Source for assets/og-image.png (the LinkedIn/social preview). Regenerate with tools/make-images.sh -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,Helvetica,Arial,sans-serif;color:#e6edf7;
    background:radial-gradient(700px 500px at 90% 10%,rgba(45,212,191,.25),transparent 70%),
               radial-gradient(600px 500px at 0% 100%,rgba(96,165,250,.2),transparent 70%),#0b1220;
    display:flex;flex-direction:column;justify-content:center;padding:0 0 0 80px;box-sizing:border-box;position:relative}
  .photo{position:absolute;right:30px;top:50%;transform:translateY(-50%);width:500px;height:500px;
    -webkit-mask-image:radial-gradient(circle closest-side,#000 88%,transparent 100%)}
  .txt{max-width:680px}
  .mark{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,#2dd4bf,#60a5fa);
    color:#0b1220;font-weight:800;font-size:46px;display:flex;align-items:center;justify-content:center;margin-bottom:40px}
  .eyebrow{font-family:Menlo,monospace;color:#2dd4bf;font-size:19px;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}
  h1{font-size:64px;line-height:1.05;margin:0 0 26px;font-weight:800;letter-spacing:-1.5px}
  .g{background:linear-gradient(90deg,#2dd4bf,#60a5fa);-webkit-background-clip:text;color:transparent}
  p{font-size:24px;color:#9aa8c0;margin:0}
</style></head>
<body>
  <img class="photo" src="../assets/profile.jpg">
  <div class="txt">
  <div class="mark">S</div>
  <div class="eyebrow">Cybersecurity · Sales · AI Automation</div>
  <h1>Shahin<br><span class="g">AI that does the busywork.</span></h1>
  <p>M.S. Computer Science (GWU) · CompTIA Security+<br>mrmadani.github.io</p>
  </div>
</body></html>
